name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the native folders this starter doesn't commit, so the
      # package resolves and analyzes cleanly.
      - run: flutter create .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      # Syntax-check the server without starting it (no keys needed).
      - run: node --check server.js
