name: Build APK

# Runs when this workflow file changes (so it builds now), or on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the android/ project (not committed in this starter).
      - run: flutter create .

      # Plugins (including sensors_plus 6) require compileSdk 36.
      - name: Patch SDK versions + permissions
        run: |
          grep -rl 'flutter.minSdkVersion' android/app | xargs sed -i 's/flutter.minSdkVersion/23/g' || true
          grep -rl 'flutter.compileSdkVersion' android/app | xargs sed -i 's/flutter.compileSdkVersion/36/g' || true
          grep -rl 'flutter.targetSdkVersion' android/app | xargs sed -i 's/flutter.targetSdkVersion/34/g' || true
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.NFC"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' "$MF"

      - run: flutter pub get

      # Release, arm64 only — small APK, signed with the debug key (installs for
      # testing). Points at the deployed test backend.
      - run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=API_BASE_URL=https://xorpay.onrender.com
          --dart-define=CASHFREE_ENV=SANDBOX

      - uses: actions/upload-artifact@v4
        with:
          name: xorpay-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
