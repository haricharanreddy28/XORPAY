<title>XORPAY Business</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: glass command-deck. Fixed rail on the left, a single scrolling deck of panels on the right.
   Single dark world by choice: deep space ground, violet/electric-blue brand light, cyan for live data. */
:root{
  color-scheme: dark;
  --ground:#07060D;
  --ground-2:#0C0A16;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.06);
  --glass-hi:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.08);
  --line-hi:rgba(168,85,247,.45);
  --ink:#F3F0FF;
  --ink-2:#B9B3D1;
  --muted:#7D7896;
  --violet:#A855F7;
  --violet-deep:#6C2BD9;
  --blue:#3B82F6;
  --cyan:#22D3EE;
  --ok:#34D399;
  --warn:#FBBF24;
  --err:#F87171;
  --grad:linear-gradient(120deg,#2563EB 0%,#6C2BD9 52%,#A855F7 100%);
  --glow:0 0 0 1px rgba(168,85,247,.35),0 10px 40px -10px rgba(124,58,237,.65);
  --f-display:"Unbounded","Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px;
  --r-sm:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::after{ /* deep-space light + engineering grid */
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 600px at 8% -10%,rgba(108,43,217,.35),transparent 60%),
    radial-gradient(800px 600px at 105% 110%,rgba(37,99,235,.28),transparent 60%),
    radial-gradient(500px 400px at 70% 20%,rgba(34,211,238,.08),transparent 70%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,
    var(--ground);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(22px,3vw,30px)}
h2{font-size:15px;letter-spacing:.01em}
h3{font-size:13px}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;min-height:100%;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:20px;align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:18px;
  padding:20px 14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(18px)}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);font-family:var(--f-display);font-weight:700;font-size:15px}
.logo-word{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:16px}
.logo-word small{display:block;font-family:var(--f-mono);font-weight:400;font-size:9.5px;letter-spacing:.2em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;position:relative;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--glass-2);color:var(--ink)}
.nav a.on{background:linear-gradient(90deg,rgba(124,58,237,.28),rgba(124,58,237,.04));color:var(--ink)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--violet);box-shadow:0 0 12px var(--violet)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.biz{padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.biz b{display:block;font-size:13px}
.biz .mono{font-size:11px;color:var(--muted)}
.plan-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;font-family:var(--f-mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line-hi);color:#E9D5FF;background:rgba(168,85,247,.12)}

.deck{min-width:0;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .grow{flex:1;min-width:0}
.demo-flag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--warn);padding:6px 10px;border-radius:99px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.live{color:var(--ok);display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}

/* ---------- primitives ---------- */
.panel{position:relative;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));backdrop-filter:blur(14px);padding:20px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:20px}
.g-hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.btn.pri:hover{box-shadow:0 0 0 1px rgba(168,85,247,.6),0 14px 50px -10px rgba(124,58,237,.9)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.p-warn{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.p-err{color:var(--err);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.p-info{color:var(--cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.08)}
.p-mute{color:var(--ink-2);border-color:var(--line);background:var(--glass)}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--glass-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.card{color:#E9D5FF;border-color:rgba(168,85,247,.35);background:rgba(168,85,247,.12)}

/* ---------- dashboard ---------- */
.hero{padding:26px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(59,130,246,.6),rgba(168,85,247,.5),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,5vw,50px);letter-spacing:-.02em;line-height:1.05;margin:10px 0 8px;background:linear-gradient(90deg,#fff,#C4B5FD 60%,#67E8F9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero-split{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hero-split div{min-width:0}
.hero-split .num{font-size:16px;font-weight:600;display:block;margin-top:2px}
.ccwrap{perspective:1000px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.cc{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:20px;padding:22px;overflow:hidden;
  background:radial-gradient(120% 120% at 0% 0%,#3B1D7A 0%,#1A1240 45%,#0B1430 100%);
  border:1px solid rgba(168,85,247,.45);box-shadow:0 30px 60px -20px rgba(76,29,149,.8),inset 0 1px 0 rgba(255,255,255,.15);
  transform:rotateX(8deg) rotateY(-12deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;justify-content:space-between}
.cc:hover{transform:rotateX(0) rotateY(0)}
.cc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.035) 18px 19px)}
.cc::after{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 65%)}
.cc>*{position:relative;z-index:1}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start}
.chip{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#F5D27A,#B8862B);opacity:.9}
.cc-num{font-family:var(--f-mono);font-size:clamp(14px,2vw,18px);letter-spacing:.18em}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:11px}
.cc-bot b{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500}
.meter{height:6px;border-radius:6px;background:var(--glass-hi);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(34,211,238,.6)}
.kpi .label{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12.5px}
.kpi .label svg{width:16px;height:16px;color:var(--violet)}
.kpi .val{font-family:var(--f-mono);font-size:24px;font-weight:600;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}

/* chart */
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;height:230px}
.yaxis{display:flex;flex-direction:column-reverse;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-bottom:22px;text-align:right}
.plot{position:relative;display:flex;align-items:flex-end;gap:14px;padding-bottom:22px}
.plot .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.stack{width:min(46px,100%);display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px 8px 3px 3px;overflow:hidden;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.seg-card{background:linear-gradient(180deg,#C084FC,#7C3AED);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.seg-bank{background:linear-gradient(180deg,#38BDF8,#1D4ED8)}
.col .xl{position:absolute;bottom:-22px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.col .tl{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);margin-bottom:5px;white-space:nowrap}
.col.now .xl{color:var(--cyan)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{font-size:12px;color:var(--muted)}
.row .amt{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.av{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--a,#6C2BD9),var(--b,#2563EB));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.when{font-family:var(--f-mono);font-size:11px;text-align:center;line-height:1.15;width:44px;flex:none;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--glass)}
.when b{display:block;font-size:16px;color:var(--ink)}
.when.soon{border-color:rgba(251,191,36,.4);color:var(--warn)}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover{background:var(--glass-2)}
td.r,th.r{text-align:right}
.cell-p{display:flex;align-items:center;gap:10px;min-width:0}
.cell-p .av{width:30px;height:30px;font-size:11px;border-radius:9px}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.input,.select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus,.select:focus{border-color:var(--line-hi);box-shadow:0 0 0 4px rgba(168,85,247,.15)}
.input.bad{border-color:rgba(248,113,113,.6)}
.select option{background:#141024}
.hint{font-size:11.5px;color:var(--muted)}
.err-t{font-size:11.5px;color:var(--err)}
.amount-in{font-family:var(--f-mono);font-size:28px;font-weight:600;padding:14px 16px 14px 40px}
.amount-box{position:relative}
.amount-box::before{content:"₹";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:24px;color:var(--muted)}

/* pay */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2);transition:all .2s}
.chipbtn:hover{color:var(--ink);background:var(--glass-2)}
.chipbtn.on{color:#fff;border-color:var(--line-hi);background:rgba(168,85,247,.18);box-shadow:0 0 18px -4px rgba(168,85,247,.7)}
.step{display:flex;flex-direction:column;gap:14px;padding:20px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step-h{display:flex;align-items:center;gap:10px}
.step-n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;background:var(--glass-2);border:1px solid var(--line);color:var(--cyan)}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.method{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:all .2s;min-width:0}
.method:hover{background:var(--glass-2)}
.method.on{border-color:var(--line-hi);background:rgba(168,85,247,.12);box-shadow:0 0 24px -8px rgba(168,85,247,.8)}
.method b{display:flex;align-items:center;justify-content:space-between;gap:6px}
.method span{font-size:11.5px;color:var(--muted)}
.method .fee{font-family:var(--f-mono);font-size:10.5px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13px}
.seg button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.form-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.summary{position:sticky;top:20px}
.receipt{font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:10px}
.receipt .line{display:flex;justify-content:space-between;gap:10px}
.receipt .line span:first-child{color:var(--ink-2);font-family:var(--f-body)}
.receipt .tot{border-top:1px dashed rgba(255,255,255,.18);padding-top:12px;margin-top:4px;font-size:18px;font-weight:600}
.callout{display:flex;gap:10px;padding:12px;border-radius:12px;font-size:12.5px;line-height:1.45;border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.06);color:#CFFAFE}
.callout svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--cyan)}
.callout.v{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08);color:#EDE4FF}
.callout.v svg{color:var(--violet)}
.callout.w{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07);color:#FEF3C7}
.callout.w svg{color:var(--warn)}

/* vendors */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.vcard{display:flex;flex-direction:column;gap:14px;transition:transform .25s,border-color .25s}
.vcard:hover{transform:translateY(-3px);border-color:rgba(168,85,247,.35)}
.vcard .top{display:flex;gap:12px;align-items:flex-start}
.vcard .top .grow{flex:1;min-width:0}
.vcard .top b{display:block;font-weight:600}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;text-align:right}
.vcard .acts{display:flex;gap:8px;margin-top:auto}

/* schedules */
.timeline{position:relative;height:96px;margin:6px 6px 0}
.timeline .track{position:absolute;left:0;right:0;top:44px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--violet),rgba(168,85,247,.1))}
.timeline .tick{position:absolute;top:52px;font-family:var(--f-mono);font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.timeline .tick::before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:6px;background:var(--muted)}
.dot{position:absolute;top:37px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);background:var(--ground);border:2px solid var(--violet);box-shadow:0 0 14px var(--violet);cursor:default}
.dot.card{border-color:#C084FC} .dot.bank{border-color:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.dot .lab{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;white-space:nowrap;color:var(--ink-2);background:rgba(7,6,13,.8);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.dot.alt .lab{bottom:auto;top:22px}
.switch{width:40px;height:22px;border-radius:99px;border:1px solid var(--line);background:var(--glass-2);position:relative;cursor:pointer;flex:none;transition:background .2s}

function niceMax(v){ if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10; return n * e; }

  const due = act.filter(s => parse(s.next) <= T0);

  const cardShare = in30.filter(s=>s.method==="card").reduce((x,s)=>x+s.amount,0);
  // timeline
  const dots = in30.slice().sort((a,b)=>a.next.localeCompare(b.next)).map((s,i) => {

          <td>${methodTag(s.method)}</td>

  </section>`;
};
function runSchedule(s){
  const v = vendor(s.vid);
  if (!v.verified){ toast(`${v.name} isn't verified. Verify it before paying.`); return false; }
  const q = quote(s.amount, s.method);
  S.seq++;
  S.txns.unshift({ id:"XP" + (5200000 + S.seq*41), date: ymd(T0), vid:s.vid, cat:s.cat, method:s.method, ...q, status:"Settled", ref:s.ref, utr:"UTR" + (442000000000 + S.seq*7919), coins: coinsFor(q.payee, s.method), auto:true });
  const n = parse(s.next);
  if (s.freq === "once") s.active = false;
  else { const base = n > T0 ? n : T0; s.next = ymd(s.freq === "weekly" ? addDays(base,7) : addMonths(base, s.freq === "quarterly" ? 3 : 1)); }
  return true;
}

      <button class="btn ${p.id===S.plan?"":"pri"}" data-action="choose-plan" data-id="${p.id}" ${p.id===S.plan?"disabled":""}>${p.id===S.plan?"Your plan":p.price==null?"Talk to sales":"Switch to " + p.name}</button>
    </section>`).join("")}
  </div>`;
};
// log-ish slider: 0..100 → ₹10 L .. ₹500 Cr
const SL_MIN = Math.log10(1e6), SL_MAX = Math.log10(5e9);
const sliderToTurnover = v => { const r = Math.pow(10, SL_MIN + (SL_MAX-SL_MIN)*v/100); const e = Math.pow(10, Math.floor(Math.log10(r)) - 1); return Math.round(r/e)*e; };
const turnoverToSlider = t => Math.round((Math.log10(Math.max(1e6,t)) - SL_MIN) / (SL_MAX-SL_MIN) * 100);
after.plans = () => {
  $("#to").addEventListener("input", e => { S.turnover = sliderToTurnover(+e.target.value); $("#to-val").textContent = short(S.turnover*100); $("#to-plan").textContent = "→ " + planFor(S.turnover).name + " plan"; });
  $("#to").addEventListener("change", () => { save(); route(); });
};

/* ================= modal / toast ================= */
let modalLocked = false, lastFocus = null;
function openModal(html, opts={}){
  lastFocus = document.activeElement;
  modalLocked = !!opts.locked;
  $("#modal-root").innerHTML = `<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal(){ if (modalLocked) return; $("#modal-root").innerHTML = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } catch(e){ openModal(`<div class="modal-h"><h2>Copy this text</h2><button class="x" data-action="close" aria-label="Close">${I("x")}</button></div><textarea class="input mono" style="height:260px;font-size:11px" id="copy-ta">${esc(text)}</textarea>`); const ta = $("#copy-ta"); ta.focus(); ta.select(); } }

/* ================= events ================= */
document.addEventListener("click", e => {
  if (e.target.matches("[data-scrim]")) { closeModal(); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.action){
    case "close": closeModal(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch(_){} S = seed(); S.v = T0.toDateString(); payDraft = null; save(); route(); toast("Demo data reset"); break;
    case "cat": payDraft.cat = a.dataset.cat; payDraft.ref = ""; route(); break;
    case "method": payDraft.method = a.dataset.m; document.querySelectorAll(".method").forEach(m => m.classList.toggle("on", m === a)); updateSummary(); break;
    case "when": payDraft.when = a.dataset.w; route(); break;
    case "amt": { const cur = parseFloat(payDraft.amount) || 0; payDraft.amount = String(cur + +a.dataset.amt); $("#f-amt").value = payDraft.amount; updateSummary(); break; }
    case "pay": doPay(); break;
    case "create-schedule": doSchedule(); break;
    case "done-pay": modalLocked = false; closeModal(); payDraft = null; location.hash = "#transactions"; if (location.hash === "#transactions") route(); break;
    case "new-schedule": payDraft = freshDraft({ when:"schedule" }); location.hash === "#pay" ? route() : (location.hash = "#pay"); break;
    case "pay-vendor": case "vendor-sched": { const v = vendor(id); payDraft = freshDraft({ cat:v.cat, vid:v.id, when: a.dataset.action === "vendor-sched" ? "schedule" : "now" }); location.hash = "#pay"; break; }
    case "add-vendor": addVendorModal(); break;
    case "verify": { const v = vendor(id); a.disabled = true; a.textContent = "Sending ₹1…"; setTimeout(() => { v.verified = true; save(); route(); toast(`${v.name} verified · name matched at bank`); }, 1100); break; }
    case "toggle": { const s = S.schedules.find(x => x.id === id); s.active = !s.active; save(); route(); toast(s.active ? "Schedule resumed" : "Schedule paused"); break; }
    case "run": { const s = S.schedules.find(x => x.id === id); if (runSchedule(s)){ save(); route(); toast(`Paid ${inr0(s.amount)} to ${vendor(s.vid).name}`); } break; }
    case "run-due": { const due = S.schedules.filter(s => s.active && parse(s.next) <= T0); let n = 0; due.forEach(s => runSchedule(s) && n++); save(); route(); toast(`${n} due payment${n===1?"":"s"} sent`); break; }
    case "txn": txnModal(id); break;
    case "copy": copy(a.dataset.text); break;
    case "csv": copy(csv()); break;
    case "rep": repMonths = +a.dataset.m; route(); break;
    case "billing": S.billing = a.dataset.b; save(); route(); break;
    case "choose-plan": { const p = PLANS.find(x => x.id === id); if (p.price == null){ toast("Our team will reach out to set up Enterprise"); break; } S.plan = id; save(); route(); toast(`Switched to ${p.name} plan`); break; }
  }
});
