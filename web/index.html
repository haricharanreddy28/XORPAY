<title>XORPAY Business</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: quiet sidebar + one calm content column (max 1120px). One task per screen; Pay is a 3-step wizard.
   Single light theme by choice: paper-white surfaces on cool grey, XORPAY violet as the only accent,
   one deep-ink "money card" for the headline figure. */
:root{
  color-scheme: light;
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --subtle:#F6F7FA;
  --line:#E7E9EE;
  --line-2:#D9DCE3;
  --ink:#0D1321;
  --ink-2:#475063;
  --muted:#8790A2;
  --brand:#6C2BD9;
  --brand-hover:#5A1FC2;
  --brand-soft:#F3EDFE;
  --brand-ink:#4C1D95;
  --deep:#14102A;
  --ok:#0B8A5F;   --ok-soft:#E6F6EF;
  --warn:#B45309; --warn-soft:#FEF4E4;
  --err:#C8312B;  --err-soft:#FDEDEC;
  --sky:#2563EB;  --sky-soft:#EAF1FE;
  --f-head:"Manrope","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sh-1:0 1px 2px rgba(13,19,33,.04),0 1px 3px rgba(13,19,33,.05);
  --sh-2:0 2px 4px rgba(13,19,33,.04),0 12px 32px -8px rgba(13,19,33,.10);
  --sh-brand:0 6px 18px -6px rgba(108,43,217,.55);
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(108,43,217,.35);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(24px,3vw,30px);font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.money{font-family:var(--f-head);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:var(--ink)}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:15px}
.logo b{font-family:var(--f-head);font-weight:800;font-size:17px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--subtle);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav .grp{margin:14px 12px 4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.side-foot{margin-top:auto;padding:14px;border-radius:14px;background:var(--subtle);border:1px solid var(--line)}
.side-foot b{display:block;font-size:13.5px}
.side-foot span{font-size:12px;color:var(--muted)}
.plan-badge{display:inline-flex;margin-top:10px;font-size:12px!important;font-weight:600;color:var(--brand-ink)!important;background:var(--brand-soft);padding:3px 10px;border-radius:99px}

.content{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.demo-bar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:1px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h p{margin-top:6px;color:var(--ink-2);max-width:62ch}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:22px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:hover{background:var(--subtle)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
.btn.pri:hover{background:var(--brand-hover)}
.btn.lg{padding:14px 22px;font-size:15px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.link{border:0;background:none;color:var(--brand);padding:6px 4px;box-shadow:none}
.btn.link:hover{background:none;text-decoration:underline}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-ok{color:var(--ok);background:var(--ok-soft)}
.b-warn{color:var(--warn);background:var(--warn-soft)}
.b-err{color:var(--err);background:var(--err-soft)}
.b-sky{color:var(--sky);background:var(--sky-soft)}
.b-brand{color:var(--brand-ink);background:var(--brand-soft)}
.b-mute{color:var(--ink-2);background:var(--subtle);border:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:14px;color:var(--c,#6C2BD9);background:var(--cb,#F3EDFE)}
.ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.ico svg{width:20px;height:20px}

/* ---------- home ---------- */
.home-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px;color:#fff;background:var(--deep);box-shadow:var(--sh-2);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero::after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.55),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .label{color:rgba(255,255,255,.6)}
.hero .money{font-size:clamp(36px,5vw,52px);line-height:1;color:#fff}
.hero p{color:rgba(255,255,255,.72)}
.split{display:flex;height:8px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.12)}
.split i{display:block;height:100%}
.split-legend{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.75)}
.split-legend b{display:block;color:#fff;font-size:16px;font-family:var(--f-head);font-variant-numeric:tabular-nums;margin-top:2px}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.credit{display:flex;flex-direction:column;gap:16px}
.bar{height:8px;border-radius:8px;background:var(--subtle);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand);border-radius:8px}
.perk{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);font-size:13.5px}
.perk svg{width:18px;height:18px;flex:none;margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .2s,transform .2s}
.qa:hover{border-color:#CDBDF7;box-shadow:var(--sh-2);transform:translateY(-2px)}
.qa .ico{margin-bottom:10px}
.qa b{font-weight:600;font-size:14.5px}
.qa span.s{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.tip{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:16px;background:linear-gradient(90deg,#F3EDFE,#FFFFFF);border:1px solid #E4D8FC}
.tip .grow{flex:1;min-width:0}
.tip b{font-family:var(--f-head);font-size:15px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow>span{font-size:12.5px;color:var(--muted)}
.item .amt{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .amt>span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.item.click{cursor:pointer;border-radius:12px;margin:0 -10px;padding-left:10px;padding-right:10px}
.item.click:hover{background:var(--subtle)}
.date{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--subtle);border:1px solid var(--line);padding:5px 0;line-height:1.15}
.date small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.date b{font-family:var(--f-head);font-size:17px}
.date.soon{background:var(--warn-soft);border-color:#F6DDB2}
.date.soon small{color:var(--warn)}
.group-t{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 2px}

/* ---------- wizard ---------- */
.wizard{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px}
.progress{display:flex;gap:8px}
.progress div{flex:1;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.progress div i{display:block;height:4px;border-radius:4px;background:var(--line)}
.progress div.on{color:var(--brand-ink)}
.progress div.on i{background:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s}
.tile:hover{border-color:#CDBDF7}
.tile.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(108,43,217,.12)}
.tile b{font-weight:600;font-size:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.choice:hover{border-color:#CDBDF7}
.choice.on{border-color:var(--brand);background:#FBF9FF;box-shadow:0 0 0 3px rgba(108,43,217,.1)}
.choice .grow{flex:1;min-width:0}
.choice .grow b{display:block;font-weight:600}
.choice .grow span{font-size:12.5px;color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.choice.on .radio{border-color:var(--brand)}
.choice.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.amount-wrap{display:flex;align-items:center;justify-content:center;gap:6px;padding:26px 16px;border-radius:18px;background:var(--subtle);border:1.5px solid var(--line);transition:border-color .15s,box-shadow .15s}
.amount-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(108,43,217,.12);background:#fff}
.amount-wrap span{font-family:var(--f-head);font-size:34px;font-weight:700;color:var(--muted)}
.amount-wrap input{border:0;background:transparent;outline:none;font-family:var(--f-head);font-weight:800;font-size:clamp(34px,6vw,48px);letter-spacing:-.03em;width:100%;max-width:360px;font-variant-numeric:tabular-nums;color:var(--ink);min-width:0}
.amount-wrap input::placeholder{color:#C3C8D2}
.quick-amt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pillbtn{padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px;cursor:pointer;color:var(--ink-2)}
.pillbtn:hover{border-color:var(--brand);color:var(--brand)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--subtle);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(108,43,217,.12)}
.form-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hint{font-size:12.5px;color:var(--muted)}
.err-t{font-size:13px;color:var(--err)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px}
.note svg{width:17px;height:17px;flex:none;margin-top:1px}
.note.ok{background:var(--ok-soft);color:#065F46}
.note.brand{background:var(--brand-soft);color:var(--brand-ink)}
.note.warn{background:var(--warn-soft);color:#92400E}
.wiz-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-bottom:0;box-shadow:0 -8px 24px -12px rgba(13,19,33,.15)}
.wiz-foot .grow{flex:1;min-width:0}
.wiz-foot .grow b{display:block;font-family:var(--f-head);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.receipt{display:flex;flex-direction:column;gap:12px}
.receipt .line{display:flex;justify-content:space-between;gap:14px}
.receipt .line span:first-child{color:var(--ink-2)}
.receipt .line span:last-child{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.receipt .total{border-top:1px dashed var(--line-2);padding-top:14px;margin-top:2px;font-size:17px}
.receipt .total span{font-weight:800!important;color:var(--ink)!important;font-family:var(--f-head)}
.review-head{display:flex;align-items:center;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0}
.check{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.check svg{width:38px;height:38px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.track{display:flex;flex-direction:column;text-align:left;width:100%;max-width:420px;margin:12px auto 0}
.st{display:flex;gap:14px;position:relative;padding-bottom:18px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:#fff;flex:none;display:grid;place-items:center;z-index:1;transition:all .25s}
.st .b svg{width:13px;height:13px;opacity:0;color:#fff}
.st.ok .b{background:var(--ok);border-color:var(--ok)}
.st.ok .b svg{opacity:1}
.st.act .b{border-color:var(--brand);border-top-color:transparent;animation:spin .9s linear infinite}
.st.ok::before{background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.st b{display:block;font-weight:600;font-size:14px}
.st span{font-size:12.5px;color:var(--muted)}

/* ---------- tables / filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input{padding-left:40px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.toggle{width:42px;height:24px;border-radius:99px;border:0;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(18px)}
.vlist .item{padding:16px 0}
.vmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--ink-2);background:var(--subtle);border:1px solid var(--line);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere}

/* reports */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat .money{font-size:26px;margin-top:8px;display:block}
.stat p{font-size:12.5px;color:var(--muted);margin-top:4px}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;height:240px}
.yaxis{display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:11.5px;color:var(--muted);padding-bottom:26px;text-align:right;font-variant-numeric:tabular-nums}
.plot{position:relative;display:flex;align-items:flex-end;gap:18px;padding-bottom:26px}
.plot .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.stack{width:min(44px,100%);display:flex;flex-direction:column;border-radius:8px 8px 4px 4px;overflow:hidden;position:relative;z-index:1}
.col .xl{position:absolute;bottom:-26px;font-size:12px;color:var(--muted)}
.col .tl{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:6px;white-space:nowrap;position:relative;z-index:1}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 72px;gap:14px;align-items:center;padding:8px 0}
.hbar .t{height:10px;border-radius:6px;background:var(--subtle);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.hbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}

/* plans */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:14px;position:relative}
.plan.rec{border:2px solid var(--brand);box-shadow:0 12px 32px -12px rgba(108,43,217,.35)}

  S.txns.unshift({ id:"XP" + (5200000 + S.seq*41), date: ymd(T0), vid:s.vid, cat:s.cat, method:s.method, ...q, status:"Settled", ref:s.ref, utr:"UTR" + (442000000000 + S.seq*7919), coins:coinsFor(q.payee, s.method), auto:true });
  if (s.freq === "once") s.active = false;
  else { const n = parse(s.next), base = n > T0 ? n : T0; s.next = ymd(s.freq === "weekly" ? addDays(base,7) : addMonths(base, s.freq === "quarterly" ? 3 : 1)); }
  return true;
}

  <section class="card"><h2 style="margin-bottom:14px">Six-month plan</h2><div class="miles">
    ${[["Month 1–2","Architecture, database and UI prototype",1],["Month 3","Working MVP release"],["Month 4","Bank and payment gateway live"],["Month 5","Pilot with real MSMEs"],["Month 6","Validation report and production launch"]].map(([m,t,now]) => `<div class="mile ${now?"now":""}"><b>${m}${now?" · now":""}</b><p>${t}</p></div>`).join("")}
  </div></section>`;

/* ================= modal / toast ================= */
let lastFocus = null;
function openModal(html){ lastFocus = document.activeElement; $("#modal-root").innerHTML = `<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $("#modal-root").innerHTML = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("Copied"); } catch(e){ openModal(`<div class="modal-h"><h2>Copy this text</h2><button class="x" data-action="close" aria-label="Close">${I("x")}</button></div><textarea class="input" style="height:240px;font-size:12px;font-family:ui-monospace,monospace" id="copy-ta" aria-label="Text to copy">${esc(text)}</textarea>`); const ta = $("#copy-ta"); ta.focus(); ta.select(); } }
function moreSheet(){
  openModal(`<div class="modal-h"><h2>More</h2><button class="x" data-action="close" aria-label="Close">${I("x")}</button></div>
    <div class="choices">${[["vendors","Vendors","users"],["reports","Reports","chart"],["plans","Plans & pricing","layers"],["about","About XORPAY","info"]].map(([h,l,i]) => `<a class="choice" href="#${h}" data-action="close" style="text-decoration:none;color:inherit"><span class="ico">${I(i)}</span><div class="grow"><b>${l}</b></div>${I("arrowR",'style="width:18px;height:18px;color:var(--muted)"')}</a>`).join("")}</div>`);
}

/* ================= events ================= */
const go = h => { if (location.hash === "#" + h) route(); else location.hash = "#" + h; };
document.addEventListener("click", e => {
  if (e.target.matches("[data-scrim]")) { closeModal(); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.action){
    case "close": closeModal(); break;
    case "more": moreSheet(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch(_){} S = seed(); S.v = T0.toDateString(); W = null; save(); route(); toast("Demo data reset"); break;
    case "hide-tip": S.tipHidden = true; save(); route(); break;
    case "start-pay": W = newW({ cat:a.dataset.cat }); go("pay"); break;
    case "new-schedule": W = newW({ mode:"schedule" }); go("pay"); break;
    case "pay-vendor": { const v = vendor(id); W = newW({ cat:v.cat, vid:v.id, step:2 }); go("pay"); break; }
    case "cancel-pay": W = null; location.hash = "#home"; break;
    case "cat": W.cat = a.dataset.cat; W.vid = ""; route(); break;
    case "pick-payee": W.vid = id; route(); break;
    case "next": W.step++; route(); break;
    case "goto": W.step = +a.dataset.step; route(); break;
    case "amt": W.amount = String(+a.dataset.amt); $("#f-amt").value = W.amount; step2Update(); break;
    case "method": W.method = a.dataset.m; document.querySelectorAll('[data-action="method"]').forEach(x => x.classList.toggle("on", x === a)); step2Update(); break;
    case "mode": W.mode = a.dataset.v; route(); break;
    case "confirm-pay": { const p = amtPaise(), q = quote(p, W.method); S.seq++;
      const t = { id:"XP" + (5200000 + S.seq*41), date: ymd(T0), vid:W.vid, cat:W.cat, method:W.method, ...q, status:"Processing", ref: W.ref || CATS[W.cat].label, utr:"", coins:0 };
      S.txns.unshift(t); save(); W.done = t.id; route(); startProcessing(); break; }
    case "confirm-schedule": { S.seq++; S.schedules.push({ id:"s" + S.seq, vid:W.vid, cat:W.cat, amount:amtPaise(), method:W.method, freq:W.freq, next:W.start, ref: W.ref || CATS[W.cat].label, active:true });
      save(); toast(`Scheduled. First payment on ${fDY(W.start)}`); W = null; location.hash = "#scheduled"; break; }
    case "pay-again": W = newW(); route(); break;
    case "finish": W = null; break;
    case "add-vendor": addVendorModal(); break;
    case "verify": { const v = vendor(id); a.disabled = true; a.textContent = "Checking with bank…"; setTimeout(() => { v.verified = true; save(); route(); toast(`${v.name} verified`); }, 1000); break; }
    case "toggle": { const s = S.schedules.find(x => x.id === id); s.active = !s.active; save(); route(); toast(s.active ? "Schedule resumed" : "Schedule paused"); break; }
    case "run": { const s = S.schedules.find(x => x.id === id); if (runSchedule(s)){ save(); route(); toast(`Paid ${inr0(s.amount)} to ${vendor(s.vid).name}`); } break; }
    case "txn": txnModal(id); break;
    case "copy": copy(a.dataset.text); break;
    case "csv": copy(csv()); break;
    case "rm": RM = +a.dataset.m; route(); break;
    case "billing": S.billing = a.dataset.b; save(); route(); break;
    case "choose-plan": { const p = PLANS.find(x => x.id === id); if (p.price == null){ toast("Our team will reach out about Enterprise"); break; } S.plan = id; save(); route(); toast(`You're on the ${p.name} plan`); break; }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "f-amt" && $("#next2") && !$("#next2").disabled) $("#next2").click();
});
window.addEventListener("hashchange", () => { if (location.hash !== "#pay" && W && W.done) W = null; route(); });
route();
})();
</script>
